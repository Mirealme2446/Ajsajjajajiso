      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar Firebase
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_JSON" ]; then
            echo '::error::Falta configurar GOOGLE_SERVICES_JSON nas secrets do repositorio.'
            exit 1
          fi
          printf '%s' "$FIREBASE_JSON" > app/google-services.json
          python3 - <<'PYTHON'
          import json
          with open('app/google-services.json', encoding='utf-8') as arquivo:
              config = json.load(arquivo)
          nomes = [c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in config.get('client', [])]
          if 'com.instamoedas.app' not in nomes:
              raise SystemExit('Pacote Firebase incorreto; use com.instamoedas.app')
          PYTHON

      - name: Gerar APK do InstaMoedas
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: InstaMoedas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
