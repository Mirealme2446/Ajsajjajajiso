name: InstaMoedas - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  montar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Recuperar projeto Android completo
        run: |
          python3 - <<'PYTHON'
          import base64, io, re, tarfile, urllib.request
          url = 'https://raw.githubusercontent.com/Mirealme2446/Ajsajjajajiso/757eddfd2c19/.github/workflows/blank.yml'
          texto = urllib.request.urlopen(url, timeout=30).read().decode('utf-8')
          trecho = re.search(r'pacote\s*=\s*"""(.*?)"""', texto, re.S)
          if not trecho:
              raise SystemExit('Projeto anterior nao encontrado no historico.')
          arquivo = base64.b64decode(trecho.group(1))
          with tarfile.open(fileobj=io.BytesIO(arquivo), mode='r:gz') as tar:
              tar.extractall('.', filter='data')
          print('Projeto InstaMoedas recuperado.')
          PYTHON

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar Firebase
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_JSON" ]; then
            echo '::error::Configure GOOGLE_SERVICES_JSON nos segredos do repositorio.'
            exit 1
          fi
          printf '%s' "$FIREBASE_JSON" > app/google-services.json
          python3 - <<'PYTHON'
          import json
          with open('app/google-services.json', encoding='utf-8') as arq:
              config = json.load(arq)
          pacotes = [x.get('client_info', {}).get('android_client_info', {}).get('package_name') for x in config.get('client', [])]
          if 'com.instamoedas.app' not in pacotes:
              raise SystemExit('Pacote Firebase incorreto: esperado com.instamoedas.app')
          PYTHON

      - name: Gerar APK do InstaMoedas
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaMoedas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
